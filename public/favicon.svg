<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="aether-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="32" height="32" rx="7" fill="#0f172a" />
  
  <!-- Outer Subtle Stroke -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="url(#aether-grad)" stroke-opacity="0.3" fill="none" />

  <!-- AetherCode Chevron / "A" Peak -->
  <path d="M16 6L7 24H11.5L16 14.5L20.5 24H25L16 6Z" fill="url(#aether-grad)" />

  <!-- Code / Terminal Prompt Slash (Crossbar) -->
  <path d="M12.5 19H19.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />

  <!-- Radiant Core Dot -->
  <circle cx="16" cy="10" r="1.5" fill="#38bdf8" filter="url(#glow)" />
</svg>
